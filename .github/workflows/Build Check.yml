name: Build Check.yml
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-interpreter:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [Release, Debug]
        # interpreter doesn't use Qt

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt-get install libreadline-dev qt6-base-dev gcc-16 g++-16

      - name: ${{ matrix.build-type }} Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}                   \
            -DCMAKE_MAKE_PROGRAM=$(which ninja)                               \
            -G Ninja                                                          \
            -S "$GITHUB_WORKSPACE"                                            \
            -B "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }}

          cmake --build "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }} --target z80interpreter -j$(nproc)
