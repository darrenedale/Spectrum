name: Build Check.yml
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-interpreter:
    name: Build Z80 interpreter
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [Debug, Release]
        # interpreter doesn't use Qt

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libreadline-dev qt6-base-dev gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: ${{ matrix.build-type }} Build
        run: |
          BUILD_START_TIMESTAMP=$(date +%s%3N)

          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}                     \
              -DCMAKE_MAKE_PROGRAM=$(which ninja)                               \
              -G Ninja                                                          \
              -S "$GITHUB_WORKSPACE"                                            \
              -B "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }}

          cmake --build "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }} --target z80interpreter -j$(nproc)
          BUILD_DURATION=$(( $(date +%s%3N) - $BUILD_START_TIMESTAMP ))
          echo "Interpreter build took ${BUILD_DURATION}ms." > "$GITHUB_STEP_SUMMARY"

  build-disassembler:
    name: Build Z80 disassembler
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [Debug, Release]
        # disassembler doesn't use Qt

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libreadline-dev qt6-base-dev gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: ${{ matrix.build-type }} Build
        run: |
          BUILD_START_TIMESTAMP=$(date +%s%3N)

          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}                     \
              -DCMAKE_MAKE_PROGRAM=$(which ninja)                               \
              -G Ninja                                                          \
              -S "$GITHUB_WORKSPACE"                                            \
              -B "$GITHUB_WORKSPACE"/build/disassembler/${{ matrix.build-type }}

          cmake --build "$GITHUB_WORKSPACE"/build/disassembler/${{ matrix.build-type }} --target z80-disassembler -j$(nproc)
          BUILD_DURATION=$(( $(date +%s%3N) - $BUILD_START_TIMESTAMP ))
          echo "Disassembler build took ${BUILD_DURATION}ms." > "$GITHUB_STEP_SUMMARY"

  build-emulator:
    name: Build Spectrum emulator
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [Debug, Release]
        qt-version: [Qt6, Qt5]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          if [ "Qt5" == ${{ matrix.qt-version }} ]; then
              QT_PACKAGES=qtbase5-dev
          else
              QT_PACKAGES=qt6-base-dev
          fi

          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libreadline-dev $QT_PACKAGES gcc-14 g++-14
#          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
#          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: ${{ matrix.build-type }} Build
        run: |
          if [ "Qt5" == ${{ matrix.qt-version }} ]; then
              QT_VERSION="-DUSE_QT5=1"
          else
              QT_VERSION=
          fi

          BUILD_START_TIMESTAMP=$(date +%s%3N)

          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}                     \
              -DCMAKE_MAKE_PROGRAM=$(which ninja)                               \
              $QT_VERSION                                                       \
              -G Ninja                                                          \
              -S "$GITHUB_WORKSPACE"                                            \
              -B "$GITHUB_WORKSPACE"/build/emulator/${{ matrix.build-type }}

          cmake --build "$GITHUB_WORKSPACE"/build/emulator/${{ matrix.build-type }} --target spectrum -j$(nproc)
          BUILD_DURATION=$(( $(date +%s%3N) - $BUILD_START_TIMESTAMP ))
          echo "Emulator build took ${BUILD_DURATION}ms." > "$GITHUB_STEP_SUMMARY"
