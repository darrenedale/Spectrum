name: Build Check.yml
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-interpreter:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-type: [Debug, Release]
        # interpreter doesn't use Qt

    concurrency:
      group: "z80interpreter"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y libreadline-dev qt6-base-dev gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 10

      - name: ${{ matrix.build-type }} Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}                   \
            -DCMAKE_MAKE_PROGRAM=$(which ninja)                               \
            -G Ninja                                                          \
            -S "$GITHUB_WORKSPACE"                                            \
            -B "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }}

          cmake --build "$GITHUB_WORKSPACE"/build/interpreter/${{ matrix.build-type }} --target z80interpreter -j$(nproc)
